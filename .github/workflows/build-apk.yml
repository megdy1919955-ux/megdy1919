name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK via Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/AlNajm-Live.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlNajm-Live-v2-APK
          path: output/AlNajm-Live.apk

      - name: Update GitHub Release with Latest APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "⭐ تطبيق النجم - النسخة الحية الرسمية المحدثة (Al-Najm Live)"
          body: |
            ### 🚀 تطبيق النجم الصوتي - النسخة الحية المحدثة 2026 (الإصدار v2.0.0)
            - **تحديث جديد كلياً:** تم تحديث هذا الملف رسمياً ليشمل تسجيل الدخول بالبريد الإلكتروني الحقيقي ومحركات الرومات الصوتية وتحديثات واجهة النجم.
            - **تحميل مباشر لملف APK:** تم توفير ملف `AlNajm-Live.apk` أدناه للتحميل المباشر بنقرة واحدة والتثبيت الفوري دون الحاجة لفك الضغط!
            
            ⚠️ **تنبيه هام جداً قبل التثبيت:**
            يرجى **حذف (إلغاء تثبيت) النسخة القديمة الموجودة في هاتفك أولاً** حتى لا يحدث تعارض في الحزم من نظام الأندرويد، ثم تثبيت ملف `AlNajm-Live.apk` الجديد مباشرة.
          files: |
            output/AlNajm-Live.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
