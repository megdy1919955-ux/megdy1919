name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Fixed Debug Keystore
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkey -v -keystore android/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=AlNajm,O=AlNajm,C=YE"
          fi

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Prepare Direct APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./AlNajm-Live.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlNajm-Android-App
          path: ./AlNajm-Live.apk

      - name: Publish Direct APK Download Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: latest
          name: "⭐ تطبيق النجم - النسخة الحية المباشرة (Al-Najm Live)"
          body: |
            ### 🚀 تطبيق النجم الصوتي - النسخة الحية الرسمية
            - **تحميل مباشر لملف APK:** تم توفير ملف `AlNajm-Live.apk` أدناه للتحميل المباشر بنقرة واحدة والتثبيت الفوري دون الحاجة لفك الضغط!
            - **الدردشة الحية الفورية:** مرتبطة بسيرفرات Google Firebase Firestore العالمية.
            - **الصوت المباشر:** مدعوم بمحرك صوت حقيقي WebRTC P2P عبر سيرفرات Google STUN.
            - **مزامنة السينما والمقاعد:** حية ومتزامنة في نفس اللحظة بين كل الأجهزة.

            ⚠️ **تنبيه هام جداً قبل التثبيت:**
            يرجى **حذف (إلغاء تثبيت) النسخة القديمة الموجودة في هاتفك أولاً** حتى لا يحدث تعارض في الحزم من نظام الأندرويد، ثم تثبيت ملف `AlNajm-Live.apk` الجديد مباشرة.
          files: ./AlNajm-Live.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
