<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معاينة Patch 4a - ربط داعمي بـ Firestore</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #0B1120;
      color: #F8FAFC;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22C55E;
      color: #4ADE80;
      font-weight: 800;
      font-size: 13px;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 22px;
      font-weight: 900;
      text-align: center;
    }
    p {
      color: #94A3B8;
      font-size: 13px;
      margin: 0 0 24px 0;
      text-align: center;
      max-width: 520px;
    }
    .card-preview {
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 28px;
      padding: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      max-width: 420px;
      width: 100%;
    }
    .img-box {
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #334155;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="badge">✅ Patch 4a: SupportersView Live Firestore</div>
  <h1>أداة "داعمي" (SupportersView) مربوطة لحظياً</h1>
  <p>تم ربط قائمة الداعمين بمسار Firestore <code>users/{hostUid}/supporters</code> مع التحديث اللحظي <code>onSnapshot</code> والترتيب التنازلي حسب إجمالي الألماس.</p>
  
  <div class="card-preview">
    <div class="img-box">
      <img src="/screenshots/supporters_view_live.svg" alt="داعمي - ربط Firestore" />
    </div>
  </div>
</body>
</html>
