<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 760" width="390" height="760" style="background:#F8FAFC;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Top Navigation Header -->
  <rect x="0" y="0" width="390" height="64" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  
  <!-- Back Button (Right side in RTL) -->
  <g transform="translate(340, 20)" cursor="pointer">
    <circle cx="16" cy="12" r="16" fill="#F1F5F9" />
    <path d="M14 7L19 12L14 17" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  <text x="328" y="32" font-size="12" font-weight="700" fill="#0F172A" text-anchor="end">رجوع</text>

  <!-- Title -->
  <text x="195" y="38" font-size="16" font-weight="900" fill="#0F172A" text-anchor="middle">سجل التحويل</text>

  <!-- Close Button -->
  <g transform="translate(16, 20)" cursor="pointer">
    <circle cx="16" cy="12" r="16" fill="#F1F5F9" />
    <path d="M11 7L21 17M21 7L11 17" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Transfer Record 1: ⏳ Pending with Cancel Button -->
  <g transform="translate(16, 84)">
    <rect x="0" y="0" width="358" height="152" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
    
    <!-- Status Badge (Left) -->
    <rect x="16" y="16" width="105" height="26" rx="13" fill="#FEF3C7" stroke="#FDE68A" />
    <text x="68" y="33" font-size="10.5" font-weight="900" fill="#92400E" text-anchor="middle">⏳ قيد المراجعة</text>

    <!-- Target Agency Title (Right) -->
    <text x="342" y="30" font-size="13" font-weight="900" fill="#0F172A" text-anchor="end">إلى: وكالة الأساطير الذهبية</text>
    <text x="342" y="46" font-size="10" font-weight="700" font-family="monospace" fill="#64748B" text-anchor="end">Agency ID: 30045</text>

    <!-- Agency Flow Route -->
    <g transform="translate(16, 58)">
      <rect x="0" y="0" width="326" height="34" rx="12" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="312" y="22" font-size="11" font-weight="700" fill="#64748B" text-anchor="end">من: وكالة النخبة الملكية</text>
      <text x="163" y="22" font-size="12" font-weight="900" fill="#94A3B8" text-anchor="middle">⬅</text>
      <text x="14" y="22" font-size="11" font-weight="900" fill="#0F172A">إلى: وكالة الأساطير الذهبية</text>
    </g>

    <!-- Footer: Date & Cancel Button -->
    <g transform="translate(16, 102)">
      <line x1="0" y1="0" x2="326" y2="0" stroke="#F1F5F9" />
      <text x="0" y="30" font-size="11" font-weight="700" font-family="monospace" fill="#94A3B8">16 أكتوبر 2026</text>
      
      <!-- Cancel Button -->
      <g transform="translate(246, 12)" cursor="pointer">
        <rect x="0" y="0" width="80" height="28" rx="14" fill="#FFF1F2" stroke="#FECDD3" />
        <text x="40" y="18" font-size="10.5" font-weight="900" fill="#E11D48" text-anchor="middle">إلغاء الطلب</text>
      </g>
    </g>
  </g>

  <!-- Transfer Record 2: ⚡ Auto Approved (Exception) -->
  <g transform="translate(16, 252)">
    <rect x="0" y="0" width="358" height="152" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
    
    <!-- Status Badge (Left) -->
    <rect x="16" y="16" width="130" height="26" rx="13" fill="#D1FAE5" stroke="#A7F3D0" />
    <text x="81" y="33" font-size="10.5" font-weight="900" fill="#065F46" text-anchor="middle">⚡ نقل فوري (استثناء)</text>

    <!-- Target Agency Title (Right) -->
    <text x="342" y="30" font-size="13" font-weight="900" fill="#0F172A" text-anchor="end">إلى: وكالة فرسان المجد</text>
    <text x="342" y="46" font-size="10" font-weight="700" font-family="monospace" fill="#64748B" text-anchor="end">Agency ID: 20011</text>

    <!-- Agency Flow Route -->
    <g transform="translate(16, 58)">
      <rect x="0" y="0" width="326" height="34" rx="12" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="312" y="22" font-size="11" font-weight="700" fill="#64748B" text-anchor="end">من: وكالة النور</text>
      <text x="163" y="22" font-size="12" font-weight="900" fill="#94A3B8" text-anchor="middle">⬅</text>
      <text x="14" y="22" font-size="11" font-weight="900" fill="#0F172A">إلى: وكالة فرسان المجد</text>
    </g>

    <!-- Footer: Date & System Note -->
    <g transform="translate(16, 102)">
      <line x1="0" y1="0" x2="326" y2="0" stroke="#F1F5F9" />
      <text x="0" y="30" font-size="11" font-weight="700" font-family="monospace" fill="#94A3B8">01 سبتمبر 2026</text>
      <text x="326" y="30" font-size="10.5" font-weight="700" fill="#059669" text-anchor="end">اعتمد آلياً دون موافقة الوكيل</text>
    </g>
  </g>

  <!-- Live Firestore Badge -->
  <g transform="translate(16, 420)">
    <rect x="0" y="0" width="358" height="52" rx="18" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" />
    <circle cx="334" cy="26" r="6" fill="#22C55E" />
    <text x="318" y="30" font-size="11" font-weight="800" fill="#166534" text-anchor="end">مرتبط لحظياً بـ Firestore: agency_transfers</text>
    <text x="318" y="44" font-size="9" font-weight="600" fill="#15803D" text-anchor="end">onSnapshot + where('hostId', '==', currentUserId)</text>
  </g>

  <!-- Bottom Watermark Hash -->
  <text x="195" y="730" font-size="11" font-weight="700" font-family="monospace" fill="#94A3B8" letter-spacing="2" text-anchor="middle" opacity="0.8">e2b39057dc</text>
</svg>
