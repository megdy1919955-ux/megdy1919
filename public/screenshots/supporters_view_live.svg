<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 760" width="390" height="760" style="background:#F8FAFC;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Top Navigation Header -->
  <rect x="0" y="0" width="390" height="64" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  
  <!-- Back Button (Right side in RTL) -->
  <g transform="translate(340, 20)" cursor="pointer">
    <circle cx="16" cy="12" r="16" fill="#F1F5F9" />
    <path d="M14 7L19 12L14 17" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  <text x="328" y="32" font-size="12" font-weight="700" fill="#0F172A" text-anchor="end">رجوع</text>

  <!-- Title -->
  <text x="195" y="38" font-size="16" font-weight="900" fill="#0F172A" text-anchor="middle">داعمي</text>

  <!-- Close Button -->
  <g transform="translate(16, 20)" cursor="pointer">
    <circle cx="16" cy="12" r="16" fill="#F1F5F9" />
    <path d="M11 7L21 17M21 7L11 17" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Sub-Header: Month Selector & Total Diamonds Banner -->
  <g transform="translate(16, 80)">
    <!-- Month Dropdown Pill (Left) -->
    <rect x="0" y="0" width="115" height="38" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
    <text x="20" y="24" font-size="11" font-weight="700" fill="#64748B">▼</text>
    <text x="95" y="24" font-size="12" font-weight="800" fill="#0F172A" text-anchor="end">2026/08</text>

    <!-- Total Diamonds (Right) -->
    <text x="358" y="14" font-size="11" font-weight="700" fill="#64748B" text-anchor="end">إجمالي دعم القائمة</text>
    <text x="358" y="34" font-size="17" font-weight="900" font-family="monospace" fill="#0F172A" text-anchor="end">5,000 💎</text>
  </g>

  <!-- Supporter Card 1: 🥇 عابر سبيل (Rank #1) -->
  <g transform="translate(16, 140)">
    <rect x="0" y="0" width="358" height="88" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
    
    <!-- Diamonds Earned (Left) -->
    <text x="20" y="36" font-size="10" font-weight="700" fill="#64748B">إجمالي الدعم:</text>
    <text x="20" y="60" font-size="16" font-weight="900" font-family="monospace" fill="#0F172A">3,500 💎</text>

    <!-- Supporter Info (Right) -->
    <text x="280" y="32" font-size="13" font-weight="900" fill="#0F172A" text-anchor="end">عابر سبيل 💎 🥇</text>
    <text x="280" y="48" font-size="10" font-weight="700" font-family="monospace" fill="#64748B" text-anchor="end">ID: 77989080</text>
    
    <!-- Badges Row -->
    <rect x="236" y="56" width="44" height="18" rx="5" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="258" y="69" font-size="9" font-weight="800" fill="#0F172A" text-anchor="middle">1 💖</text>

    <rect x="176" y="56" width="54" height="18" rx="5" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="203" y="69" font-size="9" font-weight="800" fill="#0F172A" text-anchor="middle">VIP 👑</text>

    <!-- Avatar with Rank Badge -->
    <circle cx="316" cy="44" r="24" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2" />
    <!-- Avatar Graphic -->
    <clipPath id="avatar1">
      <circle cx="316" cy="44" r="23" />
    </clipPath>
    <rect x="292" y="20" width="48" height="48" fill="#475569" clip-path="url(#avatar1)" />
    <circle cx="316" cy="38" r="10" fill="#F1F5F9" clip-path="url(#avatar1)" />
    <circle cx="316" cy="62" r="18" fill="#F1F5F9" clip-path="url(#avatar1)" />
    <!-- Crown icon on avatar -->
    <text x="294" y="64" font-size="14">👑</text>
  </g>

  <!-- Supporter Card 2: 🥈 فارس الداعمين (Rank #2) -->
  <g transform="translate(16, 242)">
    <rect x="0" y="0" width="358" height="88" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
    
    <!-- Diamonds Earned (Left) -->
    <text x="20" y="36" font-size="10" font-weight="700" fill="#64748B">إجمالي الدعم:</text>
    <text x="20" y="60" font-size="16" font-weight="900" font-family="monospace" fill="#0F172A">1,500 💎</text>

    <!-- Supporter Info (Right) -->
    <text x="280" y="32" font-size="13" font-weight="900" fill="#0F172A" text-anchor="end">فارس الداعمين 🥈</text>
    <text x="280" y="48" font-size="10" font-weight="700" font-family="monospace" fill="#64748B" text-anchor="end">ID: 1001001</text>
    
    <!-- Badges Row -->
    <rect x="236" y="56" width="44" height="18" rx="5" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="258" y="69" font-size="9" font-weight="800" fill="#0F172A" text-anchor="middle">1 💖</text>

    <rect x="176" y="56" width="54" height="18" rx="5" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="203" y="69" font-size="9" font-weight="800" fill="#0F172A" text-anchor="middle">VIP 👑</text>

    <!-- Avatar -->
    <circle cx="316" cy="44" r="24" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2" />
    <clipPath id="avatar2">
      <circle cx="316" cy="44" r="23" />
    </clipPath>
    <rect x="292" y="20" width="48" height="48" fill="#1E293B" clip-path="url(#avatar2)" />
    <circle cx="316" cy="38" r="10" fill="#E2E8F0" clip-path="url(#avatar2)" />
    <circle cx="316" cy="62" r="18" fill="#E2E8F0" clip-path="url(#avatar2)" />
  </g>

  <!-- Live Firestore Badge -->
  <g transform="translate(16, 350)">
    <rect x="0" y="0" width="358" height="52" rx="18" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" />
    <circle cx="334" cy="26" r="6" fill="#22C55E" />
    <text x="318" y="30" font-size="11" font-weight="800" fill="#166534" text-anchor="end">مرتبط لحظياً بـ Firestore: users/{hostUid}/supporters</text>
    <text x="318" y="44" font-size="9" font-weight="600" fill="#15803D" text-anchor="end">onSnapshot + orderBy('totalDiamonds', 'desc')</text>
  </g>

  <!-- Bottom Watermark Hash -->
  <text x="195" y="730" font-size="11" font-weight="700" font-family="monospace" fill="#94A3B8" letter-spacing="2" text-anchor="middle" opacity="0.8">e2b39057dc</text>
</svg>
