  <circle cx="340" cy="24" r="3" fill="#FFFFFF"/>
  <circle cx="348" cy="24" r="3" fill="#FFFFFF"/>
  <circle cx="356" cy="24" r="3" fill="#FFFFFF"/>

  <!-- Modal Header -->
  <rect y="44" width="390" height="54" fill="#FFFFFF" filter="url(#gridShadow)"/>
  <text x="195" y="78" fill="#0F172A" font-size="16" font-weight="900" text-anchor="middle">مركز المذيعين</text>
  <g transform="translate(350, 63)">
    <path d="M0 8 L10 0 L10 16 Z" fill="#64748B"/>
  </g>

