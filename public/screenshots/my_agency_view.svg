<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 760" width="390" height="760" style="background:#F8FAFC;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Status Bar -->
  <rect width="390" height="44" fill="#0F172A"/>
  <text x="32" y="28" fill="#FFFFFF" font-size="12" font-weight="bold">9:41</text>
  <circle cx="340" cy="24" r="3" fill="#FFFFFF"/>
  <circle cx="348" cy="24" r="3" fill="#FFFFFF"/>
  <circle cx="356" cy="24" r="3" fill="#FFFFFF"/>

  <!-- Header -->
  <rect y="44" width="390" height="54" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <text x="195" y="78" fill="#0F172A" font-size="16" font-weight="900" text-anchor="middle">وكالتي</text>
  <text x="350" y="78" fill="#0F172A" font-size="16" font-weight="bold">→</text>
  <text x="24" y="76" fill="#059669" font-size="11" font-weight="bold">Firestore 🟢</text>

  <!-- My Agency Card (Firestore Connected) -->
  <g transform="translate(18, 114)">
    <rect width="354" height="460" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- Row 1: معرّف الوكالة -->
    <g transform="translate(20, 20)">
      <text x="314" y="20" fill="#64748B" font-size="12" font-weight="bold" text-anchor="end">معرّف الوكالة:</text>
      <text x="0" y="20" fill="#0F172A" font-size="13" font-weight="900" font-family="monospace">AG-101</text>
      <rect x="58" y="6" width="22" height="20" rx="6" fill="#F1F5F9"/>
      <text x="69" y="20" fill="#64748B" font-size="10" text-anchor="middle">📋</text>
      <line x1="0" y1="36" x2="314" y2="36" stroke="#F1F5F9" stroke-width="1"/>
    </g>

    <!-- Row 2: اسم الوكالة -->
    <g transform="translate(20, 70)">
      <text x="314" y="20" fill="#64748B" font-size="12" font-weight="bold" text-anchor="end">اسم الوكالة:</text>
      <text x="0" y="20" fill="#0F172A" font-size="13" font-weight="900">وكالة النخبة الملكية</text>
      <line x1="0" y1="36" x2="314" y2="36" stroke="#F1F5F9" stroke-width="1"/>
    </g>

    <!-- Row 3: مستوى الوكالة -->
    <g transform="translate(20, 120)">
      <text x="314" y="20" fill="#64748B" font-size="12" font-weight="bold" text-anchor="end">مستوى الوكالة:</text>
      <rect x="0" y="5" width="28" height="22" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="14" y="21" fill="#0F172A" font-size="12" font-weight="900" text-anchor="middle">F</text>
      <line x1="0" y1="36" x2="314" y2="36" stroke="#F1F5F9" stroke-width="1"/>
    </g>

    <!-- Row 4: معرّف رئيس الوكالة -->
    <g transform="translate(20, 170)">
      <text x="314" y="20" fill="#64748B" font-size="12" font-weight="bold" text-anchor="end">معرّف رئيس الوكالة:</text>
      <text x="0" y="20" fill="#0F172A" font-size="13" font-weight="900" font-family="monospace">82639599</text>
      <rect x="74" y="6" width="22" height="20" rx="6" fill="#F1F5F9"/>
      <text x="85" y="20" fill="#64748B" font-size="10" text-anchor="middle">📋</text>
      <line x1="0" y1="36" x2="314" y2="36" stroke="#F1F5F9" stroke-width="1"/>
    </g>

    <!-- Row 5: اسم رئيس الوكالة -->
    <g transform="translate(20, 220)">
      <text x="314" y="20" fill="#64748B" font-size="12" font-weight="bold" text-anchor="end">اسم رئيس الوكالة:</text>
      <text x="0" y="20" fill="#0F172A" font-size="13" font-weight="900">ابوامجدMá🎼</text>
      <line x1="0" y1="36" x2="314" y2="36" stroke="#F1F5F9" stroke-width="1"/>
    </g>

    <!-- Row 6: وقت الانضمام -->
    <g transform="translate(20, 270)">
      <text x="314" y="20" fill="#64748B" font-size="12" font-weight="bold" text-anchor="end">وقت الانضمام:</text>
      <text x="0" y="20" fill="#334155" font-size="11" font-weight="bold" font-family="monospace">(utc+0)16:13:13 2025-12-16</text>
      <line x1="0" y1="36" x2="314" y2="36" stroke="#F1F5F9" stroke-width="1"/>
    </g>

    <!-- Row 7: إعلان الوكالة -->
    <g transform="translate(20, 320)">
      <text x="314" y="16" fill="#64748B" font-size="12" font-weight="bold" text-anchor="end">إعلان الوكالة:</text>
      <rect x="0" y="26" width="314" height="48" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="302" y="46" fill="#1E293B" font-size="10.5" font-weight="500" text-anchor="end">اي مضيف يسكر تارجت اكبر له تسكير خاص غير المضيفين</text>
      <text x="302" y="62" fill="#1E293B" font-size="10.5" font-weight="500" text-anchor="end">معا تحيت وكالت ابو امجد بتوفيق للجميع</text>
      <line x1="0" y1="84" x2="314" y2="84" stroke="#F1F5F9" stroke-width="1"/>
    </g>

    <!-- Row 8: الحالة الحالية -->
    <g transform="translate(20, 420)">
      <text x="314" y="16" fill="#64748B" font-size="12" font-weight="bold" text-anchor="end">الحالة الحالية:</text>
      <rect x="0" y="2" width="104" height="26" rx="13" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="52" y="19" fill="#047857" font-size="11" font-weight="900" text-anchor="middle">✓ تم الانضمام</text>
    </g>
  </g>

  <!-- Live Sync Badge -->
  <g transform="translate(18, 595)">
    <rect width="354" height="42" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
    <text x="177" y="26" fill="#065F46" font-size="11.5" font-weight="bold" text-anchor="middle">⚡ متصل مباشرة بمجموعة Firestore: agencies/AG-101</text>
  </g>
</svg>
