<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 740" width="390" height="740" style="background:#0F172A;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <filter id="modalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Blurred/Darkened Background Viewport -->
  <g opacity="0.3">
    <!-- Header Mock -->
    <rect width="390" height="100" fill="#1E293B"/>
    <!-- Card in background -->
    <rect x="20" y="120" width="350" height="230" rx="24" fill="#FFFFFF"/>
  </g>

  <!-- Modal Backdrop Overlay -->
  <rect width="390" height="740" fill="#000000" fill-opacity="0.6"/>

  <!-- Centered Withdrawal Modal Container -->
  <g transform="translate(25, 130)" filter="url(#modalShadow)">
    <rect width="340" height="470" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Modal Header -->
    <text x="295" y="42" fill="#0F172A" font-size="15" font-weight="900" text-anchor="end">طلب سحب الأرباح 💳</text>
    <!-- Close Button (X) -->
    <circle cx="45" cy="36" r="14" fill="#F1F5F9"/>
    <text x="45" y="41" fill="#64748B" font-size="13" font-weight="bold" text-anchor="middle">✕</text>
    <line x1="20" y1="62" x2="320" y2="62" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- 📱 المستطيل 1: إدخال UID المستلم -->
    <g transform="translate(20, 80)">
      <text x="300" y="16" fill="#0F172A" font-size="12" font-weight="900" text-anchor="end">📱 المستطيل 1: معرّف المستلم (UID)</text>
      <!-- Input Box -->
      <rect y="26" width="300" height="44" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="285" y="53" fill="#94A3B8" font-size="11" font-weight="500" text-anchor="end">أدخل UID المستلم (مثال: 82639599)...</text>
      <!-- Sub-notice -->
      <text x="300" y="90" fill="#94A3B8" font-size="9.5" font-weight="500" text-anchor="end">* اكتب الـ UID لعرض صورة واسم الشخص المستلم فورياً</text>
    </g>

    <!-- 💰 المستطيل 2: إدخال المبلغ -->
    <g transform="translate(20, 195)">
      <line x1="0" y1="0" x2="300" y2="0" stroke="#F1F5F9" stroke-width="1.5"/>
      
      <text x="300" y="24" fill="#0F172A" font-size="12" font-weight="900" text-anchor="end">💰 المستطيل 2: إدخال المبلغ ($)</text>
      <text x="10" y="24" fill="#059669" font-size="11" font-weight="bold" text-anchor="start" font-family="monospace">المتاح: $25.50 (من الهدايا)</text>
      
      <!-- Input Box -->
      <rect y="36" width="300" height="46" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="25" y="65" fill="#94A3B8" font-size="16" font-weight="bold" font-family="monospace">0.00</text>
      <text x="12" y="65" fill="#64748B" font-size="14" font-weight="bold">$</text>
      
      <!-- [الكل] Button Inside Input -->
      <rect x="245" y="44" width="45" height="30" rx="8" fill="#E2E8F0"/>
      <text x="267" y="63" fill="#334155" font-size="10.5" font-weight="900" text-anchor="middle">الكل</text>
    </g>

    <!-- Notice Box -->
    <g transform="translate(20, 310)">
      <rect width="300" height="60" rx="14" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
      <text x="285" y="25" fill="#92400E" font-size="10" font-weight="bold" text-anchor="end">⚠️ تنبيه هندسي:</text>
      <text x="285" y="44" fill="#B45309" font-size="9.5" font-weight="500" text-anchor="end">هذه الواجهة تجريبية (Mockup) وسيتم تفعيل الربط الفعلي في المرحلة 4.</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(20, 395)">
      <!-- تأكيد السحب -->
      <rect x="155" width="145" height="46" rx="16" fill="#059669" stroke="#047857" stroke-width="1"/>
      <text x="227" y="28" fill="#FFFFFF" font-size="12" font-weight="900" text-anchor="middle">تأكيد السحب</text>

      <!-- إلغاء -->
      <rect x="0" width="145" height="46" rx="16" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <text x="72" y="28" fill="#475569" font-size="12" font-weight="900" text-anchor="middle">إلغاء</text>
    </g>

  </g>
</svg>
